<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Logic Jigsaw Puzzle</title>
<style>
    :root {
        --board-outer: #1c1d1f;
        --board-plate: #2b2d30;
        --cell-outer: #383b40;
        --cell-inner: #242528;
        --piece-white: #ffffff;
        --piece-red: #e62429;
        --piece-blue: #1d5ec9;
        --piece-yellow: #f8c818;
        --piece-gray: #71767d;
        --overlap-red: #ff1e27;
    }

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body, html {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        background-color: #d8e5f2;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        display: flex;
        flex-direction: column;
    }

    #screens {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
    }

    .screen {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 10px;
        overflow-y: auto;
    }

    .screen.active {
        display: flex;
    }

    /* Home View */
    h1 {
        margin: 10px 0 2px 0;
        color: #1f2429;
        font-size: 26px;
        text-align: center;
    }
    p.subtitle {
        margin: 0 0 12px 0;
        color: #57606a;
        font-size: 13px;
        text-align: center;
    }

    /* Solved Puzzle Board Preview */
    #home-preview-wrapper {
        margin-bottom: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .preview-caption {
        font-size: 12px;
        font-weight: 600;
        color: #4f5862;
        margin-bottom: 6px;
    }
    #preview-board {
        width: 192px;
        height: 192px;
        background: var(--board-outer);
        border: 4px solid #141517;
        border-radius: 12px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.25);
        position: relative;
        padding: 4px;
    }
    #preview-inner {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--board-plate);
        border-radius: 6px;
        overflow: hidden;
    }
    .preview-piece {
        position: absolute;
        border: 1.5px solid rgba(0,0,0,0.45);
        border-radius: 3px;
        box-shadow: inset 0 1px 1px rgba(255,255,255,0.3);
    }

    /* Simple 2-Option Home Menu */
    .home-actions-card {
        width: 90%;
        max-width: 340px;
        background: #ffffff;
        border: 2px solid #b8c9d9;
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .form-group label {
        font-size: 13px;
        font-weight: 700;
        color: #24292f;
    }

    .custom-select-picker {
        width: 100%;
        padding: 12px 14px;
        font-size: 16px;
        font-weight: 700;
        color: #24292f;
        background: #f6f8fa;
        border: 2px solid #cfd7df;
        border-radius: 10px;
        outline: none;
        cursor: pointer;
        transition: border 0.2s;
    }
    .custom-select-picker:focus {
        border-color: #1f6feb;
    }

    .btn-action-primary {
        width: 100%;
        padding: 13px 16px;
        background: #1f6feb;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 3px 10px rgba(31, 111, 235, 0.25);
    }
    .btn-action-primary:active { transform: scale(0.97); }

    .btn-action-secondary {
        width: 100%;
        padding: 12px 16px;
        background: #ffffff;
        color: #24292f;
        font-size: 15px;
        font-weight: 700;
        border: 2px solid #cfd7df;
        border-radius: 10px;
        cursor: pointer;
    }
    .btn-action-secondary:active { background: #f0f3f6; }

    /* Game Header */
    #header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        max-width: 400px;
        height: 38px;
        margin-bottom: 4px;
    }
    .badge {
        font-size: 15px;
        font-weight: 700;
        color: #24292f;
    }
    .ctrl-btns { display: flex; gap: 8px; }
    .ctrl-btn {
        padding: 5px 12px;
        background: #fff;
        border: 1px solid #aaa;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
    }
    .ctrl-btn:active { background: #e0e0e0; }

    /* Custom Mode Banner */
    #setup-bar {
        display: none;
        width: 100%;
        max-width: 400px;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
    }

    /* 8x8 Board Frame */
    #board-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 2px 0 6px 0;
    }

    #board-frame {
        background: var(--board-outer);
        border: 4px solid #141517;
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.35);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #board-container {
        position: relative;
        background: var(--board-plate);
        border-radius: 8px;
        overflow: hidden;
    }

    .grid-cell {
        position: absolute;
        box-sizing: border-box;
        border-radius: 20%;
        background: var(--cell-outer);
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
    }
    .grid-cell-inner {
        width: 70%;
        height: 70%;
        border-radius: 20%;
        background: var(--cell-inner);
        border: 1px solid rgba(255,255,255,0.06);
    }

    /* Tray Area (Touch pan-y scrollable) */
    #pieces-tray {
        width: 100%;
        max-width: 420px;
        height: 175px;
        background: rgba(255, 255, 255, 0.65);
        border: 2px solid #a9bed2;
        border-radius: 12px;
        padding: 10px;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        align-items: center;
        justify-content: center;
        gap: 12px;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
        position: relative;
        scroll-behavior: smooth;
    }

    .piece-slot {
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: pan-y;
        transition: width 0.15s ease, height 0.15s ease;
    }

    .piece {
        box-sizing: border-box;
        border-radius: 6px;
        cursor: grab;
        border: 2px solid rgba(0, 0, 0, 0.4);
        box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.3), 1px 2px 5px rgba(0,0,0,0.3);
        touch-action: none;
        transition: outline 0.12s;
    }
    .piece:active { cursor: grabbing; }

    .piece.dragging {
        z-index: 9999 !important;
        box-shadow: 0 14px 30px rgba(0,0,0,0.45);
        opacity: 0.95;
        transform: scale(1.03);
    }

    .piece.colliding {
        outline: 4px solid var(--overlap-red) !important;
        outline-offset: -2px;
        box-shadow: 0 0 12px rgba(255, 30, 39, 0.85) !important;
        animation: pulseOverlap 0.8s infinite alternate;
    }
    @keyframes pulseOverlap {
        0% { outline-color: #ff1e27; }
        100% { outline-color: #ff8c8c; }
    }

    .piece.fixed-block {
        background-color: var(--piece-gray) !important;
        border-color: #3b3d40 !important;
    }

    #victory-card {
        display: none;
        width: 100%;
        max-width: 400px;
        background: #ffffff;
        border-radius: 12px;
        padding: 12px 16px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.18);
        text-align: center;
        margin-top: 6px;
        animation: popUp 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        z-index: 100;
    }
    @keyframes popUp {
        0% { transform: scale(0.85); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }
    .victory-title {
        font-size: 17px;
        font-weight: 800;
        color: #1a7f37;
        margin-bottom: 8px;
    }
    .victory-actions {
        display: flex;
        gap: 10px;
        justify-content: center;
    }
    .btn-vic {
        padding: 8px 18px;
        font-size: 14px;
        font-weight: 700;
        border-radius: 8px;
        border: none;
        cursor: pointer;
    }
    .btn-vic-next { background: #1f6feb; color: white; }
    .btn-vic-rand { background: #f0f3f6; color: #24292f; border: 1px solid #d0d7de; }

    #confetti-canvas {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 999;
        display: none;
    }
</style>
</head>
<body>

<div id="screens">
    <!-- Home Menu -->
    <div id="home-screen" class="screen active">
        <h1>Logic Jigsaw</h1>
        <p class="subtitle">Mondrian Logic Challenge</p>
        
        <!-- Solved Puzzle Board Illustration -->
        <div id="home-preview-wrapper">
            <div class="preview-caption">Example Solved State</div>
            <div id="preview-board">
                <div id="preview-inner"></div>
            </div>
        </div>

        <!-- 2 Options Card: Choose Level (Picker) & Custom Level -->
        <div class="home-actions-card">
            <div class="form-group">
                <label for="level-select">Choose Level:</label>
                <select id="level-select" class="custom-select-picker"></select>
            </div>
            <button class="btn-action-primary" id="btn-play-selected">Play Selected Level</button>
            <button class="btn-action-secondary" id="btn-create-custom">✏️ Set Custom Puzzle</button>
        </div>
    </div>

    <!-- Gameplay Screen -->
    <div id="game-screen" class="screen">
        <div id="header">
            <span class="badge" id="level-title">Level 01</span>
            <span class="badge" id="timer">00:00</span>
            <div class="ctrl-btns">
                <button class="ctrl-btn" id="btn-pause">Pause</button>
                <button class="ctrl-btn" id="btn-home">Home</button>
            </div>
        </div>

        <div id="setup-bar">
            <span style="font-size: 13px; font-weight: bold; color: #18191a;">Place 3 gray pieces on board</span>
            <button class="ctrl-btn" style="background:#1f6feb; color:#fff;" id="btn-start-custom">Start Game</button>
        </div>

        <div id="board-wrapper">
            <div id="board-frame">
                <div id="board-container"></div>
            </div>
        </div>

        <div id="victory-card">
            <div class="victory-title" id="victory-text">🎉 Puzzle Solved!</div>
            <div class="victory-actions">
                <button class="btn-vic btn-vic-next" id="btn-next-level">Next Level</button>
                <button class="btn-vic btn-vic-rand" id="btn-random-level">Random Level</button>
            </div>
        </div>

        <div style="font-size: 11px; color: #5a6673; margin: 3px 0;">Tap to rotate 90° • Drag onto grid • Swipe tray to scroll</div>
        
        <div id="pieces-tray"></div>
    </div>
</div>

<canvas id="confetti-canvas"></canvas>

    { id: 'q_1x3', w: 1, h: 3, color: 'var(--piece-gray)', isFixed: true }
];

/**
 * Extracts question block objects [x, y, w, h] directly from the matrix[span_4](start_span)[span_4](end_span)
 */
function extractBlocksFromMatrix(matrix) {
    const visited = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(false));
    const blocks = [];

    for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
            const val = matrix[r][c];
            if (val > 0 && !visited[r][c]) {
                const cells = [];
                const queue = [[r, c]];
                visited[r][c] = true;

                while (queue.length > 0) {
                    const [cr, cc] = queue.shift();
                    cells.push([cr, cc]);
                    const neighbors = [[cr+1, cc], [cr-1, cc], [cr, cc+1], [cr, cc-1]];
                    for (const [nr, nc] of neighbors) {
                        if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                            if (!visited[nr][nc] && matrix[nr][nc] === val) {
                                visited[nr][nc] = true;
                                queue.push([nr, nc]);
                            }
                        }
                    }
                }

                const minR = Math.min(...cells.map(p => p[0]));
                const maxR = Math.max(...cells.map(p => p[0]));
                const minC = Math.min(...cells.map(p => p[1]));
                const maxC = Math.max(...cells.map(p => p[1]));

                blocks.push({
                    type: val, // 1, 2, or 3
                    x: minC,
                    y: minR,
                    w: maxC - minC + 1,
                    h: maxR - minR + 1
                });
            }
        }
    }
    return blocks;
}

// Audio Synthesizer
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function ensureAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
    try {
        ensureAudio();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'tap') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, t);
            gain.gain.setValueAtTime(0.08, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
            osc.start(t);
            osc.stop(t + 0.08);
            if (navigator.vibrate) navigator.vibrate(10);
        } else if (type === 'snap') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(320, t);
            osc.frequency.setValueAtTime(540, t + 0.05);
            gain.gain.setValueAtTime(0.15, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
            osc.start(t);
            osc.stop(t + 0.14);
            if (navigator.vibrate) navigator.vibrate(20);
        } 
        // else if (type === 'error') {
        //     osc.type = 'sawtooth';
        //     osc.frequency.setValueAtTime(140, t);
        //     gain.gain.setValueAtTime(0.2, t);
        //     gain.gain.linearRampToValueAtTime(0.001, t + 0.22);
        //     osc.start(t);
        //     osc.stop(t + 0.22);
        //     if (navigator.vibrate) navigator.vibrate([40, 50, 40]);
        // } 
        else if (type === 'error') {
            // Smooth, subtle error tone
            osc.type = 'sine'; // Soft, warm tone without buzzy harmonics
            
            // Pitch gently glides downward (subtle rejection cue)
            osc.frequency.setValueAtTime(220, t);
            osc.frequency.exponentialRampToValueAtTime(140, t + 0.18);
            
            // Gain envelope: fast 5ms attack to avoid clicking, followed by a soft decay
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.linearRampToValueAtTime(0.08, t + 0.005); // Lower peak volume (0.08 vs 0.2)
            gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
            
            osc.start(t);
            osc.stop(t + 0.18);
            
            // Lighter, single haptic tap instead of three hard pulses
            if (navigator.vibrate) navigator.vibrate(30);
        } 
        
        else if (type === 'win') {
            const notes = [440, 554.37, 659.25, 880];
            notes.forEach((freq, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = 'triangle';
                o.frequency.setValueAtTime(freq, t + i * 0.1);
                g.gain.setValueAtTime(0.18, t + i * 0.1);
                g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.35);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start(t + i * 0.1);
                o.stop(t + i * 0.1 + 0.36);
            });
            if (navigator.vibrate) navigator.vibrate([60, 40, 80, 40, 150]);
        }
    } catch(e){}
}

function computeDynamicDimensions() {
    const sw = window.innerWidth;
    const sh = window.innerHeight;
    const verticalReserve = 290;
    const maxBoardDim = Math.min(380, sw - 32, sh - verticalReserve);
    cellSize = Math.floor(maxBoardDim / BOARD_SIZE);
    
    const boardInnerDim = cellSize * BOARD_SIZE;
    const framePadding = Math.max(6, Math.floor(cellSize * 0.15));

    boardContainer.style.width = boardInnerDim + 'px';
    boardContainer.style.height = boardInnerDim + 'px';
    boardFrame.style.padding = framePadding + 'px';

    renderGridCircles();
    syncAllPieceElements();
}

function renderGridCircles() {
    boardContainer.querySelectorAll('.grid-cell').forEach(c => c.remove());
    const inset = Math.max(2, Math.floor(cellSize * 0.08));
    const size = cellSize - (inset * 2);

    for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
            const cell = document.createElement('div');
            cell.className = 'grid-cell';
            cell.style.left = (c * cellSize + inset) + 'px';
            cell.style.top = (r * cellSize + inset) + 'px';
            cell.style.width = size + 'px';
            cell.style.height = size + 'px';

            const inner = document.createElement('div');
            inner.className = 'grid-cell-inner';
            cell.appendChild(inner);

            boardContainer.appendChild(cell);
        }
    }
}

function renderPieceElements() {
    document.querySelectorAll('.piece').forEach(el => el.remove());
    trayContainer.innerHTML = '';

    Object.values(pieceStates).forEach(state => {
        const el = document.createElement('div');
        el.className = 'piece' + (state.isFixed ? ' fixed-block' : '');
        el.id = 'dom_' + state.id;
        el.style.backgroundColor = state.color;
        el.style.width = (state.w * cellSize) + 'px';
        el.style.height = (state.h * cellSize) + 'px';
        
        attachPointerEvents(el, state.id);

        if (state.onBoard) {
            el.style.position = 'absolute';
            el.style.left = (state.x * cellSize) + 'px';
            el.style.top = (state.y * cellSize) + 'px';
            boardContainer.appendChild(el);
        } else {
            const slot = document.createElement('div');
            slot.className = 'piece-slot';
            slot.id = 'slot_' + state.id;
            slot.style.width = (state.w * cellSize) + 'px';
            slot.style.height = (state.h * cellSize) + 'px';

            el.style.position = 'relative';
            el.style.left = '0px';
            el.style.top = '0px';
            slot.appendChild(el);
            trayContainer.appendChild(slot);
        }
    });

    validateCollisions();
}

function syncAllPieceElements() {
    Object.values(pieceStates).forEach(state => {
        const el = document.getElementById('dom_' + state.id);
        const slot = document.getElementById('slot_' + state.id);
        if (!el) return;
        el.style.width = (state.w * cellSize) + 'px';
        el.style.height = (state.h * cellSize) + 'px';
        if (slot) {
            slot.style.width = (state.w * cellSize) + 'px';
            slot.style.height = (state.h * cellSize) + 'px';
        }
        if (state.onBoard) {
            el.style.left = (state.x * cellSize) + 'px';
            el.style.top = (state.y * cellSize) + 'px';
        }
    });
}

function attachPointerEvents(el, id) {
    let startX = 0, startY = 0;
    let initialLeft = 0, initialTop = 0;
    let hasMoved = false;

    el.onpointerdown = (e) => {
        const state = pieceStates[id];
        if (state.isFixed && (!isCustomMode || !isSetupPhase)) return;
        if (isPaused) return;

        ensureAudio();
        activePointer = { id, pointerId: e.pointerId, el };
        el.setPointerCapture(e.pointerId);

        startX = e.clientX;
        startY = e.clientY;
        hasMoved = false;

        const rect = el.getBoundingClientRect();
        initialLeft = rect.left;
        initialTop = rect.top;
    };

    el.onpointermove = (e) => {
        if (!activePointer || activePointer.id !== id) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        if (!hasMoved && Math.hypot(dx, dy) > 6) {
            hasMoved = true;
            el.classList.add('dragging');
            document.body.appendChild(el);
            el.style.position = 'fixed';
        }

        if (hasMoved) {
            el.style.left = (initialLeft + dx) + 'px';
            el.style.top = (initialTop + dy) + 'px';
        }
    };

    el.onpointerup = (e) => {
        if (!activePointer || activePointer.id !== id) return;
        el.releasePointerCapture(e.pointerId);
        el.classList.remove('dragging');
        activePointer = null;

        const state = pieceStates[id];

        // 1. Tapping -> Rotate in-place
        if (!hasMoved) {
            rotatePiece(state, el);
            return;
        }

        // 2. Dragging -> Snap or Tray Return
        const bRect = boardContainer.getBoundingClientRect();
        const pRect = el.getBoundingClientRect();

        const relX = pRect.left - bRect.left;
        const relY = pRect.top - bRect.top;

        const targetCol = Math.round(relX / cellSize);
        const targetRow = Math.round(relY / cellSize);

        if (targetCol >= 0 && targetRow >= 0 && 
            (targetCol + state.w) <= BOARD_SIZE && 
            (targetRow + state.h) <= BOARD_SIZE) {
            
            state.onBoard = true;
            state.x = targetCol;
            state.y = targetRow;

            // Remove empty slot placeholder from tray
            const prevSlot = document.getElementById('slot_' + state.id);
            if (prevSlot) prevSlot.remove();

            boardContainer.appendChild(el);
            el.style.position = 'absolute';
            el.style.left = (state.x * cellSize) + 'px';
            el.style.top = (state.y * cellSize) + 'px';

            // Auto scroll tray to top after piece moved to board
            trayContainer.scrollTo({ top: 0, behavior: 'smooth' });

            const hasCollided = validateCollisions();
            if (hasCollided) {
                playSound('error');
            } else {
                playSound('snap');
            }
        } else {
            returnPieceToTray(state, el);
        }

        checkVictoryCondition();
    };
}

function rotatePiece(state, el) {
    const prevW = state.w;
    const prevH = state.h;
    state.w = prevH;
    state.h = prevW;

    if (state.onBoard) {
        if (state.x + state.w > BOARD_SIZE) state.x = BOARD_SIZE - state.w;
        if (state.y + state.h > BOARD_SIZE) state.y = BOARD_SIZE - state.h;
        if (state.x < 0) state.x = 0;
        if (state.y < 0) state.y = 0;

        boardContainer.appendChild(el);
        el.style.position = 'absolute';
        el.style.left = (state.x * cellSize) + 'px';
        el.style.top = (state.y * cellSize) + 'px';
    } else {
        const slot = document.getElementById('slot_' + state.id);
        if (slot) {
            slot.style.width = (state.w * cellSize) + 'px';
            slot.style.height = (state.h * cellSize) + 'px';
            slot.appendChild(el);
        }
        el.style.position = 'relative';
        el.style.left = '0px';
        el.style.top = '0px';
    }

    el.style.width = (state.w * cellSize) + 'px';
    el.style.height = (state.h * cellSize) + 'px';

    playSound('tap');
    const hasOverlap = validateCollisions();
    if (state.onBoard && hasOverlap) playSound('error');

    checkVictoryCondition();
}

/**
 * Puts returned piece at the FIRST position of tray and scrolls to top
 */
function returnPieceToTray(state, el) {
    state.onBoard = false;
    let slot = document.getElementById('slot_' + state.id);
    if (!slot) {
        slot = document.createElement('div');
        slot.className = 'piece-slot';
        slot.id = 'slot_' + state.id;
    }
    
    slot.style.width = (state.w * cellSize) + 'px';
    slot.style.height = (state.h * cellSize) + 'px';
    slot.appendChild(el);

    // Prepend to first position in tray
    trayContainer.prepend(slot);

    el.style.position = 'relative';
    el.style.left = '0px';
    el.style.top = '0px';

    // Smooth scroll to top of scroll view
    trayContainer.scrollTo({ top: 0, behavior: 'smooth' });

    playSound('snap');
    validateCollisions();
}

function validateCollisions() {
    let hasAnyOverlap = false;
    const placed = Object.values(pieceStates).filter(p => p.onBoard);

    placed.forEach(p => {
        const el = document.getElementById('dom_' + p.id);
        if (el) el.classList.remove('colliding');
    });

    for (let i = 0; i < placed.length; i++) {
        for (let j = i + 1; j < placed.length; j++) {
            const p1 = placed[i];
            const p2 = placed[j];

            const overlap = !(
                p1.x + p1.w <= p2.x ||
                p2.x + p2.w <= p1.x ||
                p1.y + p1.h <= p2.y ||
                p2.y + p2.h <= p1.y
            );

            if (overlap) {
                hasAnyOverlap = true;
                const el1 = document.getElementById('dom_' + p1.id);
                const el2 = document.getElementById('dom_' + p2.id);
                if (el1) el1.classList.add('colliding');
                if (el2) el2.classList.add('colliding');
            }
        }
    }
    return hasAnyOverlap;
}

function checkVictoryCondition() {
    if (isSetupPhase) return;

    const allPieces = Object.values(pieceStates);
    if (!allPieces.every(p => p.onBoard)) return;
    if (validateCollisions()) return;

    const grid = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(0));
    allPieces.forEach(p => {
        for (let r = p.y; r < p.y + p.h; r++) {
            for (let c = p.x; c < p.x + p.w; c++) {
                grid[r][c]++;
            }
        }
    });

    for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
            if (grid[r][c] !== 1) return;
        }
    }

    clearInterval(timerInterval);
    playSound('win');
    triggerConfettiCelebration();

    const vicCard = document.getElementById('victory-card');
    document.getElementById('victory-text').innerText = `🎉 Solved in ${document.getElementById('timer').innerText}!`;
    vicCard.style.display = 'block';
}

function resetAndStartTimer() {
    clearInterval(timerInterval);
    elapsedSeconds = 0;
    isPaused = false;
    document.getElementById('btn-pause').innerText = 'Pause';
    updateTimerText();
    timerInterval = setInterval(() => {
        if (!isPaused) {
            elapsedSeconds++;
            updateTimerText();
        }
    }, 1000);
}

function resetTimerDisplay() {
    clearInterval(timerInterval);
    elapsedSeconds = 0;
    updateTimerText();
}

function updateTimerText() {
    const mins = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
    const secs = String(elapsedSeconds % 60).padStart(2, '0');
    document.getElementById('timer').innerText = `${mins}:${secs}`;
}

document.getElementById('btn-pause').onclick = function() {
    if (isSetupPhase) return;
    isPaused = !isPaused;
    this.innerText = isPaused ? 'Resume' : 'Pause';
    boardContainer.style.opacity = isPaused ? '0.2' : '1';
    trayContainer.style.opacity = isPaused ? '0.2' : '1';
};

document.getElementById('btn-home').onclick = function() {
    clearInterval(timerInterval);
    switchScreen('home-screen');
};

function switchScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

window.addEventListener('resize', () => {
    if (document.getElementById('game-screen').classList.contains('active')) {
        computeDynamicDimensions();
    }
});

function triggerConfettiCelebration() {
    const cvs = document.getElementById('confetti-canvas');
    cvs.style.display = 'block';
    cvs.width = window.innerWidth;
    cvs.height = window.innerHeight;
    const ctx = cvs.getContext('2d');
    
    const colors = ['#e62429', '#f8c818', '#1d5ec9', '#ffffff', '#2ea043'];
    const particles = [];

    for (let i = 0; i < 110; i++) {
        particles.push({
            x: cvs.width * 0.5,
            y: cvs.height * 0.45,
            w: Math.random() * 8 + 5,
            h: Math.random() * 5 + 3,
            vx: (Math.random() - 0.5) * 20,
            vy: (Math.random() - 0.7) * 18,
            angle: Math.random() * 360,
            vRot: (Math.random() - 0.5) * 10,
            color: colors[Math.floor(Math.random() * colors.length)],
            alpha: 1
        });
    }

    let frame = 0;
    function render() {
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        let alive = false;

        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.38;
            p.vx *= 0.98;
            p.angle += p.vRot;

            if (frame > 55) p.alpha -= 0.018;

            if (p.alpha > 0 && p.y < cvs.height) {
                alive = true;
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.translate(p.x, p.y);
                ctx.rotate((p.angle * Math.PI) / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                ctx.restore();
            }
        });

        frame++;
        if (alive) {
            requestAnimationFrame(render);
        } else {
            cvs.style.display = 'none';
        }
    }
    requestAnimationFrame(render);
}
</script>
